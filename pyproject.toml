[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "party-player"
version = "2.0.0b1"
description = "DeckRelay – Automatic Two-Deck Music Player"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2,<6",
    "python-vlc>=3.0.21203,<4",
    "tinytag>=2.1,<3",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.gui-scripts]
party-player = "party_player.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
